const BADGE_ORDER = ["Zouk's #1", "Zouk's #2", "Zouk's #3", 'Best Seller', 'Fast Selling', 'Trending', 'New Launch', 'Back in Stock', 'Unbadged'];
function badgeGroup(b) {
  if (b.startsWith("Zouk's #")) return 'zk';
  if (b === 'Best Seller') return 'bs';
  if (b === 'Fast Selling') return 'fs';
  if (b === 'Trending') return 'tr';
  if (b === 'New Launch') return 'nl';
  if (b === 'Back in Stock') return 'bis';
  return 'unbadged';
}
const BADGE_COLOR_VAR = { zk: 'chip-zk', bs: 'chip-bs', fs: 'chip-fs', tr: 'chip-tr', nl: 'chip-nl', bis: 'chip-bis', unbadged: 'muted' };
const BADGE_COLOR = Object.fromEntries(BADGE_ORDER.map(b => [b, `var(--${BADGE_COLOR_VAR[badgeGroup(b)]})`]));
const badgeClass = b => 'b-' + badgeGroup(b);

function fmtNum(n, decimals) {
  if (n === null || n === undefined) return '—';
  if (n >= 999999) return '∞';
  return n.toLocaleString('en-IN', { maximumFractionDigits: decimals, minimumFractionDigits: 0 });
}

const CATEGORIES = [...new Set(DATA.map(d => d.category))].sort((a, b) => a.localeCompare(b));
const CAT_COUNTS = {};
CATEGORIES.forEach(c => CAT_COUNTS[c] = DATA.filter(d => d.category === c).length);
const BADGE_COUNTS = {};
BADGE_ORDER.forEach(b => BADGE_COUNTS[b] = DATA.filter(d => d.badge === b).length);
const STAGE_ORDER = [...new Set(DATA.map(d => d.npd))].sort((a, b) => a.localeCompare(b));
const STAGE_COUNTS = {};
STAGE_ORDER.forEach(s => STAGE_COUNTS[s] = DATA.filter(d => d.npd === s).length);

// ---------- Generic multi-select dropdown ----------
function buildMultiSelect({ id, label, options, getColor, searchable }) {
  const root = document.getElementById(id);
  const selected = new Set(); // empty = "all"

  root.innerHTML = `
    <button class="msbutton" aria-haspopup="listbox" aria-expanded="false">
      <span class="lbl">${label}</span><span id="${id}-caption">All</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="mspanel" id="${id}-panel" hidden>
      ${searchable ? `<div class="mssearch"><input type="text" placeholder="Search ${label.toLowerCase()}…" id="${id}-search"></div>` : ''}
      <div class="msactions">
        <button data-act="all">Select all</button>
        <button data-act="none">Clear</button>
      </div>
      <div class="msoptions" id="${id}-options"></div>
    </div>`;

  const btn = root.querySelector('.msbutton');
  const panel = root.querySelector('.mspanel');
  const caption = root.querySelector(`#${id}-caption`);
  const optionsBox = root.querySelector(`#${id}-options`);
  const searchInput = searchable ? root.querySelector(`#${id}-search`) : null;

  function renderOptions(filterText) {
    const ft = (filterText || '').toLowerCase();
    const opts = options.filter(o => !ft || o.value.toLowerCase().includes(ft));
    if (!opts.length) {
      optionsBox.innerHTML = `<div class="msempty">No matches</div>`;
      return;
    }
    optionsBox.innerHTML = opts.map(o => `
      <label class="msoption">
        <input type="checkbox" value="${o.value}" ${selected.has(o.value) ? 'checked' : ''}>
        ${getColor ? `<span class="swatch" style="background:${getColor(o.value)}"></span>` : ''}
        <span>${o.value}</span>
        <span class="n">${o.count}</span>
      </label>`).join('');
    optionsBox.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) selected.add(cb.value); else selected.delete(cb.value);
        updateCaption();
        onChange();
      });
    });
  }

  function updateCaption() {
    if (selected.size === 0) caption.textContent = 'All';
    else if (selected.size === options.length) caption.textContent = 'All';
    else caption.textContent = selected.size;
    btn.querySelector('.count')?.remove();
    if (selected.size > 0 && selected.size < options.length) {
      const span = document.createElement('span');
      span.className = 'count';
      span.textContent = selected.size;
      caption.textContent = '';
      btn.insertBefore(span, btn.querySelector('svg'));
    }
  }

  function openPanel() {
    panel.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    renderOptions(searchInput ? searchInput.value : '');
    if (searchInput) searchInput.focus();
  }
  function closePanel() {
    panel.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (panel.hidden) {
      document.querySelectorAll('.mspanel').forEach(p => { p.hidden = true; });
      document.querySelectorAll('.msbutton').forEach(b => b.setAttribute('aria-expanded', 'false'));
      openPanel();
    } else {
      closePanel();
    }
  });
  document.addEventListener('click', (e) => {
    if (!root.contains(e.target)) closePanel();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePanel();
  });

  root.querySelector('.msactions').addEventListener('click', (e) => {
    const act = e.target.dataset.act;
    if (!act) return;
    if (act === 'all') options.forEach(o => selected.add(o.value));
    if (act === 'none') selected.clear();
    updateCaption();
    renderOptions(searchInput ? searchInput.value : '');
    onChange();
  });

  if (searchInput) searchInput.addEventListener('input', () => renderOptions(searchInput.value));

  renderOptions('');
  updateCaption();

  return { getSelected: () => selected };
}

let onChange = () => {};

const catMS = buildMultiSelect({
  id: 'ms-category',
  label: 'Category',
  options: CATEGORIES.map(c => ({ value: c, count: CAT_COUNTS[c] })),
  searchable: true
});
const stageMS = buildMultiSelect({
  id: 'ms-stage',
  label: 'Stage',
  options: STAGE_ORDER.map(s => ({ value: s, count: STAGE_COUNTS[s] })),
  searchable: false
});
const badgeMS = buildMultiSelect({
  id: 'ms-badge',
  label: 'Badge',
  options: BADGE_ORDER.map(b => ({ value: b, count: BADGE_COUNTS[b] })),
  getColor: (b) => BADGE_COLOR[b],
  searchable: false
});
const skuSearchEl = document.getElementById('skuSearch');
const productSearchEl = document.getElementById('productSearch');
skuSearchEl.addEventListener('input', () => onChange());
productSearchEl.addEventListener('input', () => onChange());

const BADGE_PRIORITY = Object.fromEntries(BADGE_ORDER.map((b, i) => [b, i]));
function rankKey(d) {
  return [BADGE_PRIORITY[d.badge], -d.drr, d.category, d.sku];
}

// ---------- Sortable columns ----------
const COLUMNS = [
  { key: 'badge',    label: 'Badge',       type: 'text', get: d => order_(d.badge) },
  { key: 'category', label: 'Category',    type: 'text', get: d => d.category.toLowerCase() },
  { key: 'sku',       label: 'SKU',         type: 'text', get: d => d.sku.toLowerCase() },
  { key: 'name',      label: 'Product',     type: 'text', get: d => d.name.toLowerCase() },
  { key: 'npd',       label: 'Stage',       type: 'text', get: d => d.npd },
  { key: 'drr',       label: 'DRR/day',     type: 'num' , get: d => d.drr },
  { key: 'drr7',      label: 'DRR 7d',      type: 'num' , get: d => d.drr7 },
  { key: 'qty30',     label: 'Qty 30d',     type: 'num' , get: d => d.qty30 },
  { key: 'doh',       label: 'DOH',         type: 'num' , get: d => (d.doh === null ? -1 : d.doh) },
  { key: 'inv',       label: 'Inv today',   type: 'num' , get: d => d.inv },
  { key: 'activeDays30', label: 'Active days', type: 'num', get: d => d.activeDays30 },
];
function order_(b) {
  return BADGE_PRIORITY[b];
}

let sortState = null; // { key, dir: 1 | -1 }

const ARROW = `<span class="arrows">
  <svg class="up" viewBox="0 0 10 6" fill="currentColor"><path d="M5 0l5 6H0z"/></svg>
  <svg class="down" viewBox="0 0 10 6" fill="currentColor"><path d="M5 6L0 0h10z"/></svg>
</span>`;

function renderHead() {
  const row = document.getElementById('theadRow');
  row.innerHTML = COLUMNS.map(c => {
    const cls = ['sortable']; if (c.type === 'num') cls.push('num');
    return `<th class="${cls.join(' ')}" data-key="${c.key}">${c.label}${ARROW}</th>`;
  }).join('');
  row.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      const col = COLUMNS.find(c => c.key === key);
      if (sortState && sortState.key === key) {
        sortState.dir = -sortState.dir;
      } else {
        sortState = { key, dir: col.type === 'num' ? -1 : 1 }; // numbers: high-to-low first; text: A-Z first
      }
      renderTable();
    });
  });
}

function updateHeadIndicators() {
  document.querySelectorAll('#theadRow th.sortable').forEach(th => {
    if (sortState && th.dataset.key === sortState.key) {
      th.setAttribute('data-dir', sortState.dir === 1 ? 'asc' : 'desc');
    } else {
      th.removeAttribute('data-dir');
    }
  });
}

function renderTable() {
  const cats = catMS.getSelected();
  const stages = stageMS.getSelected();
  const badges = badgeMS.getSelected();
  const skuQ = skuSearchEl.value.trim().toLowerCase();
  const productQ = productSearchEl.value.trim().toLowerCase();
  const filtered = DATA.filter(d =>
    (cats.size === 0 || cats.has(d.category)) &&
    (stages.size === 0 || stages.has(d.npd)) &&
    (badges.size === 0 || badges.has(d.badge)) &&
    (!skuQ || d.sku.toLowerCase().includes(skuQ)) &&
    (!productQ || d.name.toLowerCase().includes(productQ))
  ).sort((a, b) => {
    if (sortState) {
      const col = COLUMNS.find(c => c.key === sortState.key);
      const va = col.get(a), vb = col.get(b);
      let cmp = va < vb ? -1 : va > vb ? 1 : 0;
      if (cmp !== 0) return cmp * sortState.dir;
      return a.sku.localeCompare(b.sku); // stable tiebreak
    }
    const ka = rankKey(a), kb = rankKey(b);
    for (let i = 0; i < ka.length; i++) {
      if (ka[i] < kb[i]) return -1;
      if (ka[i] > kb[i]) return 1;
    }
    return 0;
  });

  updateHeadIndicators();
  document.getElementById('resultCount').textContent = `${filtered.length} of ${DATA.length} SKUs`;
  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
  document.querySelector('.tablescroll').style.display = filtered.length ? '' : 'none';

  document.getElementById('tbody').innerHTML = filtered.map(d => `
    <tr>
      <td>${d.badge === 'Unbadged' ? '<span class="b-unbadged">—</span>' : `<span class="badge-chip ${badgeClass(d.badge)}"><span class="dot"></span>${d.badge}${d.rank ? ' #' + d.rank : ''}</span>`}</td>
      <td class="cat">${d.category}</td>
      <td class="sku-code">${d.sku}</td>
      <td class="name" title="${d.name}">${d.name}</td>
      <td><span class="npd-pill">${d.npd}</span></td>
      <td class="num">${fmtNum(d.drr, 1)}</td>
      <td class="num">${fmtNum(d.drr7, 1)}</td>
      <td class="num">${fmtNum(d.qty30, 0)}</td>
      <td class="num">${fmtNum(d.doh, 1)}</td>
      <td class="num">${fmtNum(d.inv, 0)}</td>
      <td class="num">${d.activeDays30}/30</td>
    </tr>`).join('');
}

onChange = renderTable;
renderHead();
renderTable();
</script>
